paths:
  /api/mocks/users:
    get:
      summary: Generar usuarios simulados en memoria
      tags: [Mocks]
      parameters:
        - in: query
          name: num
          schema:
            type: integer
            default: 50
          description: Cantidad de usuarios mock a generar
      responses:
        200:
          description: Lista de usuarios simulados generada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        400:
          description: Parámetro numérico inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/mocks/products:
    get:
      summary: Generar productos simulados en memoria
      tags: [Mocks]
      parameters:
        - in: query
          name: num
          schema:
            type: integer
            default: 50
          description: Cantidad de productos mock a generar
      responses:
        200:
          description: Lista de productos simulados generada con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        400:
          description: Parámetro numérico inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/mocks/seed:
    post:
      summary: Insertar usuarios y productos mock en la base de datos
      tags: [Mocks]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: integer
                  example: 10
                products:
                  type: integer
                  example: 10
      responses:
        201:
          description: Base de datos poblada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Datos insertados correctamente
        400:
          description: Cantidades inválidas para el seed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        500:
          description: Error al persistir los datos simulados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
