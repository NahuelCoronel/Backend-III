components:
  schemas:
    UserDocument:
      type: object
      properties:
        originalName:
          type: string
          example: "dni-frente.pdf"
        filename:
          type: string
          example: "1710892300000-dni-frente.pdf"
        path:
          type: string
          example: "uploads/documents/1710892300000-dni-frente.pdf"
        mimetype:
          type: string
          example: "application/pdf"
        size:
          type: integer
          example: 1048576
        documentType:
          type: string
          example: "identification"
        uploadedAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        _id:
          type: string
          example: "652f1a2b3c4d5e6f7a8b9c0d"
        firstName:
          type: string
          example: "Nahuel"
        lastName:
          type: string
          example: "Pérez"
        email:
          type: string
          example: "nahuel@example.com"
        role:
          type: string
          example: "user"
        documents:
          type: array
          items:
            $ref: '#/components/schemas/UserDocument'
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
      properties:
        firstName:
          type: string
          example: "Nahuel"
        lastName:
          type: string
          example: "Pérez"
        email:
          type: string
          example: "nahuel@example.com"
        password:
          type: string
          example: "123456"
        role:
          type: string
          example: "user"

paths:
  /api/users:
    get:
      summary: Obtener todos los usuarios
      tags: [Users]
      responses:
        200:
          description: Lista de usuarios obtenida exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        500:
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Crear un nuevo usuario
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        201:
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/User'
        400:
          description: Faltan campos obligatorios o formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}:
    get:
      summary: Obtener usuario por ID
      tags: [Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de MongoDB del usuario
      responses:
        200:
          description: Usuario encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/User'
        400:
          description: Identificador no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Actualizar un usuario por ID
      tags: [Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de MongoDB del usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        200:
          description: Usuario actualizado con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/User'
        400:
          description: Datos enviados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar un usuario por ID
      tags: [Users]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de MongoDB del usuario
      responses:
        200:
          description: Usuario eliminado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Usuario eliminado
        400:
          description: Identificador no válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{uid}/documents:
    post:
      summary: Sube documentos asociados a un usuario
      tags: [Users]
      parameters:
        - in: path
          name: uid
          required: true
          schema:
            type: string
          description: ID de MongoDB del usuario
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                documentType:
                  type: string
                  description: Tipo de documento
                  example: identification
                documents:
                  type: array
                  description: Archivos a subir
                  items:
                    type: string
                    format: binary
            responses:
        200:
          description: Documentos subidos y registrados con éxito
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Documentos subidos y registrados con éxito
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserDocument'
        400:
          description: No se enviaron archivos o datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


